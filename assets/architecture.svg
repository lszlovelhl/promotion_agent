<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">推广申请处理 Agent · Master-Sub 架构</text>

  <!-- 顶部：飞书入口 -->
  <rect x="250" y="60" width="380" height="66" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="440" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#4338ca">飞书群 @机器人</text>
  <text x="440" y="108" text-anchor="middle" font-size="12" fill="#5b6472">长连接免公网 IP · 用户口语化发送申请文本</text>

  <line x1="440" y1="126" x2="440" y2="156" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="448" y="146" font-size="11" fill="#8a8f98">消息事件</text>

  <!-- Master Agent -->
  <rect x="240" y="158" width="400" height="60" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="440" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#0369a1">Master Agent（主协调者）</text>
  <text x="440" y="206" text-anchor="middle" font-size="12" fill="#5b6472">任务编排 · 幂等指纹拦截（MD5）· 状态流转 pending / confirmed</text>

  <line x1="440" y1="218" x2="440" y2="248" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 四个 Sub Agent -->
  <rect x="50" y="250" width="185" height="110" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="142" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">1 · Extractor</text>
  <text x="142" y="300" text-anchor="middle" font-size="12" fill="#5b6472">规则正则优先（快准零成本）</text>
  <text x="142" y="320" text-anchor="middle" font-size="12" fill="#5b6472">LLM 兜底口语化文本</text>
  <text x="142" y="340" text-anchor="middle" font-size="11" fill="#8a8f98">字段名容错映射</text>

  <rect x="255" y="250" width="185" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="347" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">2 · Validator</text>
  <text x="347" y="300" text-anchor="middle" font-size="12" fill="#5b6472">金额/笔数一致性</text>
  <text x="347" y="320" text-anchor="middle" font-size="12" fill="#5b6472">日期逻辑·抖加档位</text>
  <text x="347" y="340" text-anchor="middle" font-size="11" fill="#8a8f98">笔误(编辑距离≤2)·重复申请</text>

  <rect x="460" y="250" width="185" height="110" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="552" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#be185d">3 · LarkWriter</text>
  <text x="552" y="300" text-anchor="middle" font-size="12" fill="#5b6472">按博主匹配</text>
  <text x="552" y="320" text-anchor="middle" font-size="12" fill="#5b6472">自动更新多维表格字段</text>
  <text x="552" y="340" text-anchor="middle" font-size="11" fill="#8a8f98">写表后汇报结果</text>

  <rect x="665" y="250" width="170" height="110" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="750" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">4 · Reporter</text>
  <text x="750" y="300" text-anchor="middle" font-size="12" fill="#5b6472">金额汇总</text>
  <text x="750" y="320" text-anchor="middle" font-size="12" fill="#5b6472">异常简报</text>
  <text x="750" y="340" text-anchor="middle" font-size="11" fill="#8a8f98">负责人日报</text>

  <!-- 子 Agent → 确认卡片 -->
  <line x1="440" y1="360" x2="440" y2="392" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 人工确认 -->
  <rect x="230" y="394" width="420" height="66" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="440" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#0369a1">人工确认卡片（模板卡片）</text>
  <text x="440" y="442" text-anchor="middle" font-size="12" fill="#5b6472">回调 3 秒内异步返回 · 支持修改意见 · 卡片更新走 cardkit 接口</text>

  <line x1="440" y1="460" x2="440" y2="492" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 落地存储 -->
  <rect x="200" y="494" width="480" height="66" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="440" y="520" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">落地与可观测</text>
  <text x="440" y="542" text-anchor="middle" font-size="12" fill="#5b6472">records.json（确认记录）· processed_messages.json（幂等指纹）· Web 监管后台</text>

  <!-- 底部工程化 -->
  <rect x="150" y="580" width="580" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="607" text-anchor="middle" font-size="12" fill="#5b6472">工程化：Docker / CI（26 项单元测试）· 准确率评测双模式 P/R/F1 100%</text>
</svg>
